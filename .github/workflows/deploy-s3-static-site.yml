name: "Reusable Deploy S3 Static Website"

on:
  workflow_call:
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_REGION:
        required: true
      S3_BUCKET_NAME:
        required: true
    inputs:
      source_dir:
        type: string
        description: 'Source directory to upload to S3.'
        required: false
        default: 'public'
      cache_control:
        type: string
        description: 'Cache-Control header for uploaded objects.'
        required: false
        default: 'max-age=31536000,public'
      delete_remote:
        type: string
        description: 'Remove remote objects that are not present locally.'
        required: false
        default: 'false'
      pr_approval_required:
        type: string
        description: 'When true, deploys through a GitHub environment that can require PR approval.'
        required: false
        default: 'false'
      deployment_environment:
        type: string
        description: 'GitHub environment name used for approval gating when pr_approval_required=true.'
        required: false
        default: ''

jobs:
  deploy:
    if: ${{ inputs.pr_approval_required != 'true' || inputs.deployment_environment == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="${{ inputs.source_dir }}"
          BUCKET="${{ secrets.S3_BUCKET_NAME }}"
          CACHE_CONTROL="${{ inputs.cache_control }}"
          DELETE_FLAG=""
          if [[ "${{ inputs.delete_remote }}" == 'true' ]]; then
            DELETE_FLAG='--delete'
          fi

          aws s3 sync "$SOURCE_DIR" "s3://$BUCKET" \
            --acl public-read \
            --cache-control "$CACHE_CONTROL" \
            $DELETE_FLAG

  deploy_with_approval:
    if: ${{ inputs.pr_approval_required == 'true' && inputs.deployment_environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="${{ inputs.source_dir }}"
          BUCKET="${{ secrets.S3_BUCKET_NAME }}"
          CACHE_CONTROL="${{ inputs.cache_control }}"
          DELETE_FLAG=""
          if [[ "${{ inputs.delete_remote }}" == 'true' ]]; then
            DELETE_FLAG='--delete'
          fi

          aws s3 sync "$SOURCE_DIR" "s3://$BUCKET" \
            --cache-control "$CACHE_CONTROL" \
            $DELETE_FLAG
